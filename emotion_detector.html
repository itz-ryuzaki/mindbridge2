<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emotion Detector</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e8e6f0;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #fff;
  }

  header h1 span {
    color: #a78bfa;
  }

  header p {
    font-size: 0.85rem;
    color: #6b6880;
    margin-top: 0.4rem;
    font-weight: 300;
  }

  .container {
    display: flex;
    gap: 1.5rem;
    width: 100%;
    max-width: 900px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .video-panel {
    position: relative;
    flex: 1 1 400px;
    max-width: 480px;
  }

  .video-wrapper {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #111118;
    border: 1px solid #2a2840;
    aspect-ratio: 4/3;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1);
  }

  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 0.75rem;
    font-size: 0.78rem;
    color: #6b6880;
    font-family: 'Space Mono', monospace;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ef4444;
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .status-dot.active { background: #4ade80; box-shadow: 0 0 6px #4ade8066; }
  .status-dot.loading { background: #f59e0b; animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  #startBtn {
    width: 100%;
    margin-top: 0.75rem;
    padding: 0.75rem;
    background: #a78bfa;
    color: #0a0a0f;
    border: none;
    border-radius: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.2s, transform 0.1s;
  }
  #startBtn:hover { background: #c4b5fd; }
  #startBtn:active { transform: scale(0.98); }
  #startBtn:disabled { background: #2a2840; color: #6b6880; cursor: not-allowed; }

  .info-panel {
    flex: 1 1 280px;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .emotion-card {
    background: #111118;
    border: 1px solid #2a2840;
    border-radius: 16px;
    padding: 1.25rem;
  }

  .emotion-card h2 {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: #6b6880;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .main-emotion {
    text-align: center;
    padding: 1rem 0;
  }

  .emotion-emoji {
    font-size: 3.5rem;
    line-height: 1;
    display: block;
    margin-bottom: 0.5rem;
    filter: saturate(1.4);
    transition: all 0.3s ease;
  }

  .emotion-label {
    font-size: 1.5rem;
    font-weight: 500;
    color: #fff;
    text-transform: capitalize;
    letter-spacing: -0.02em;
    transition: all 0.3s;
  }

  .emotion-conf {
    font-size: 0.78rem;
    color: #a78bfa;
    font-family: 'Space Mono', monospace;
    margin-top: 0.25rem;
  }

  .placeholder-text {
    color: #3a3850;
    font-size: 0.9rem;
    text-align: center;
    padding: 1.5rem 0;
  }

  .bars-card {
    background: #111118;
    border: 1px solid #2a2840;
    border-radius: 16px;
    padding: 1.25rem;
    flex: 1;
  }

  .bars-card h2 {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: #6b6880;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0.6rem;
  }

  .bar-label {
    font-size: 0.72rem;
    color: #9d9ab0;
    width: 72px;
    flex-shrink: 0;
    text-transform: capitalize;
  }

  .bar-track {
    flex: 1;
    height: 6px;
    background: #1e1c2e;
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }

  .bar-pct {
    font-size: 0.68rem;
    font-family: 'Space Mono', monospace;
    color: #6b6880;
    width: 32px;
    text-align: right;
    flex-shrink: 0;
  }

  .fps-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: #3a3850;
    position: absolute;
    bottom: 8px;
    right: 10px;
    background: rgba(10,10,15,0.7);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .loading-overlay {
    position: fixed; inset: 0;
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 1rem;
  }

  .loading-overlay p {
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    color: #6b6880;
  }

  .spinner {
    width: 36px; height: 36px;
    border: 2px solid #2a2840;
    border-top-color: #a78bfa;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .no-face-msg {
    text-align: center;
    font-size: 0.8rem;
    color: #3a3850;
    padding: 1.5rem 0;
    font-family: 'Space Mono', monospace;
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p id="loadingMsg">loading models...</p>
</div>

<header>
  <h1>emotion<span>.</span>detect</h1>
  <p>real-time facial expression analysis — runs locally in your browser</p>
</header>

<div class="container">
  <div class="video-panel">
    <div class="video-wrapper">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <span class="fps-badge" id="fpsBadge">-- fps</span>
    </div>
    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">camera off</span>
    </div>
    <button id="startBtn">START CAMERA</button>
  </div>

  <div class="info-panel">
    <div class="emotion-card">
      <h2>dominant emotion</h2>
      <div class="main-emotion" id="mainEmotion">
        <span class="placeholder-text">start camera to begin</span>
      </div>
    </div>
    <div class="bars-card">
      <h2>all expressions</h2>
      <div id="barsContainer">
        <div class="no-face-msg">no face detected</div>
      </div>
    </div>
  </div>
</div>

<script>
const EMOTIONS = ['neutral','happy','sad','angry','fearful','disgusted','surprised'];
const EMOJI = { neutral:'😐', happy:'😄', sad:'😢', angry:'😠', fearful:'😨', disgusted:'🤢', surprised:'😲' };
const COLORS = { neutral:'#9d9ab0', happy:'#fbbf24', sad:'#60a5fa', angry:'#f87171', fearful:'#c084fc', disgusted:'#4ade80', surprised:'#fb923c' };

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';

let running = false;
let animId = null;
let lastFps = performance.now();
let fpsFrames = 0;

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const startBtn = document.getElementById('startBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const mainEmotion = document.getElementById('mainEmotion');
const barsContainer = document.getElementById('barsContainer');
const fpsBadge = document.getElementById('fpsBadge');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingMsg = document.getElementById('loadingMsg');

async function loadModels() {
  loadingMsg.textContent = 'loading face detector...';
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  loadingMsg.textContent = 'loading expression model...';
  await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
  loadingOverlay.style.display = 'none';
}

function setStatus(state) {
  statusDot.className = 'status-dot ' + state;
  const labels = { '': 'camera off', loading: 'starting...', active: 'detecting' };
  statusText.textContent = labels[state] ?? state;
}

function renderMainEmotion(emotion, confidence) {
  mainEmotion.innerHTML = `
    <span class="emotion-emoji">${EMOJI[emotion]}</span>
    <div class="emotion-label">${emotion}</div>
    <div class="emotion-conf">${Math.round(confidence * 100)}% confidence</div>
  `;
}

function renderBars(expressions) {
  const sorted = Object.entries(expressions).sort((a, b) => b[1] - a[1]);
  barsContainer.innerHTML = sorted.map(([em, val]) => `
    <div class="bar-row">
      <span class="bar-label">${em}</span>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Math.round(val*100)}%;background:${COLORS[em]}"></div>
      </div>
      <span class="bar-pct">${Math.round(val*100)}%</span>
    </div>
  `).join('');
}

async function detect() {
  if (!running) return;

  const result = await faceapi.detectSingleFace(
    video,
    new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 })
  ).withFaceExpressions();

  overlay.width = video.videoWidth || video.offsetWidth;
  overlay.height = video.videoHeight || video.offsetHeight;
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  if (result) {
    const { x, y, width, height } = result.detection.box;
    const scaleX = overlay.width / (video.videoWidth || overlay.width);
    const scaleY = overlay.height / (video.videoHeight || overlay.height);

    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 2;
    ctx.strokeRect(x * scaleX, y * scaleY, width * scaleX, height * scaleY);

    ctx.fillStyle = '#a78bfa';
    ctx.fillRect(x * scaleX, y * scaleY - 24, width * scaleX, 24);
    ctx.fillStyle = '#0a0a0f';
    ctx.font = '600 12px DM Sans, sans-serif';
    ctx.fillText('face detected', x * scaleX + 6, y * scaleY - 8);

    const expressions = result.expressions;
    const dominant = Object.entries(expressions).reduce((a, b) => a[1] > b[1] ? a : b);
    renderMainEmotion(dominant[0], dominant[1]);
    renderBars(expressions);
  } else {
    mainEmotion.innerHTML = `<span class="placeholder-text">no face detected</span>`;
    barsContainer.innerHTML = `<div class="no-face-msg">position your face<br>in the camera</div>`;
  }

  fpsFrames++;
  const now = performance.now();
  if (now - lastFps > 1000) {
    fpsBadge.textContent = `${fpsFrames} fps`;
    fpsFrames = 0;
    lastFps = now;
  }

  animId = setTimeout(detect, 120);
}

startBtn.addEventListener('click', async () => {
  if (running) {
    running = false;
    clearTimeout(animId);
    video.srcObject?.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    setStatus('');
    startBtn.textContent = 'START CAMERA';
    mainEmotion.innerHTML = `<span class="placeholder-text">start camera to begin</span>`;
    barsContainer.innerHTML = `<div class="no-face-msg">no face detected</div>`;
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    return;
  }

  setStatus('loading');
  startBtn.disabled = true;
  startBtn.textContent = 'CONNECTING...';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
    video.srcObject = stream;
    await new Promise(res => { video.onloadedmetadata = res; });
    video.play();

    running = true;
    setStatus('active');
    startBtn.disabled = false;
    startBtn.textContent = 'STOP CAMERA';
    detect();
  } catch(e) {
    setStatus('');
    startBtn.disabled = false;
    startBtn.textContent = 'START CAMERA';
    alert('Camera access denied. Please allow camera permissions and try again.');
  }
});

loadModels().catch(e => {
  loadingMsg.textContent = 'model load failed. refresh to retry.';
  console.error(e);
});
</script>
</body>
</html>
